spring.application.name=library-backend

# H2 Database (file-based, zero-setup local development)
spring.datasource.url=jdbc:h2:file:./librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (visit http://localhost:8080/h2-console while the app is running)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# JWT
# IMPORTANT: replace this with a long, random secret before deploying to production.
app.jwt.secret=change-this-to-a-long-random-secret-in-production-0123456789ABCDEF
app.jwt.expiration-ms=86400000
